<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050b1a"/>
      <stop offset="1" stop-color="#0d1c3a"/>
    </linearGradient>
    <radialGradient id="gate" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e6f3ff"/>
      <stop offset="0.25" stop-color="#8ec0ff"/>
      <stop offset="0.6" stop-color="#2f63d9"/>
      <stop offset="1" stop-color="#1a2f7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4D8DFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4D8DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1220" stop-opacity="1"/>
      <stop offset="0.42" stop-color="#0B1220" stop-opacity="0.85"/>
      <stop offset="0.62" stop-color="#0B1220" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="700" height="300" fill="url(#sky)"/>
  <g fill="#cfe2ff">
    <circle cx="420" cy="30" r="1.4"/><circle cx="470" cy="70" r="1"/><circle cx="640" cy="40" r="1.5"/>
    <circle cx="600" cy="90" r="1"/><circle cx="680" cy="120" r="1.2"/><circle cx="380" cy="80" r="1"/>
    <circle cx="520" cy="18" r="1.1"/><circle cx="660" cy="200" r="1"/>
  </g>

  <!-- montañas lejanas -->
  <path fill="#0e2147" d="M300,230 L380,170 L430,200 L500,140 L560,190 L620,150 L700,200 L700,300 L300,300 Z"/>

  <!-- puerta de mazmorra -->
  <ellipse cx="560" cy="150" rx="150" ry="150" fill="url(#halo)"/>
  <ellipse cx="560" cy="150" rx="70" ry="105" fill="url(#gate)" filter="url(#blur6)"/>
  <g fill="none" stroke="#9cc4ff" stroke-width="2">
    <ellipse cx="560" cy="150" rx="64" ry="98" opacity="0.9"/>
    <ellipse cx="560" cy="150" rx="50" ry="80" opacity="0.5" stroke-dasharray="18 8"/>
    <ellipse cx="560" cy="150" rx="78" ry="116" opacity="0.35" stroke-dasharray="4 10"/>
  </g>
  <ellipse cx="560" cy="150" rx="26" ry="44" fill="#ffffff" opacity="0.85" filter="url(#blur6)"/>

  <!-- suelo -->
  <path fill="#040814" d="M300,262 Q450,240 700,258 L700,300 L300,300 Z"/>
  <ellipse cx="560" cy="262" rx="110" ry="10" fill="#4D8DFF" opacity="0.35" filter="url(#blur6)"/>

  <!-- cazador (de espaldas) -->
  <g fill="#02050b">
    <!-- abrigo -->
    <path d="M470,168 C458,172 452,184 450,200 L444,262 L462,262 L466,232 L470,262 L500,262 L502,232 L506,262 L524,262 L518,200 C516,184 510,172 498,168 Z"/>
    <!-- cabeza y cabello -->
    <path d="M472,150 L468,138 L476,142 L474,128 L482,136 L486,122 L492,134 L500,126 L498,140 L506,136 L500,150 C500,162 494,170 486,170 C478,170 472,162 472,150 Z"/>
    <!-- brazo con daga -->
    <path d="M452,190 L436,228 L444,232 L458,200 Z"/>
    <path d="M438,226 L420,262 L426,264 L446,230 Z"/>
    <path d="M516,190 L528,226 L520,230 L510,200 Z"/>
  </g>
  <!-- luz de contorno -->
  <g fill="none" stroke="#70A7FF" stroke-width="1.5" opacity="0.8" filter="url(#blur2)">
    <path d="M498,168 C510,172 516,184 518,200 L524,262"/>
    <path d="M500,150 C500,162 494,170 486,170"/>
    <path d="M516,190 L528,226"/>
  </g>
  <path d="M438,226 L420,262" stroke="#bfe0ff" stroke-width="1.5" opacity="0.9"/>

  <!-- degradado para que el texto se lea -->
  <rect width="700" height="300" fill="url(#fade)"/>
</svg>
